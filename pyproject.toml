[tool.black]
exclude = '''
/(
  | migrations/
  | venv
  | env
  | manage\.py
  | __pycache__
  | .*\.json$
  | /static/
  | /media/
  | settings.py
)/'''
line-length = 120

skip-string-normalization = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "product.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["."]
